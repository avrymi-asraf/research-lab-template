<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title><!-- TITLE --></title>
  <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
  <style>
    :root {
      --bg: #0f1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #f0c14b;
      --accent-dim: rgba(240, 193, 75, 0.15);
      --node-border: #484f58;
      --highlight: #f0c14b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-shrink: 0;
    }
    header h1 {
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    header p {
      font-size: 0.8rem;
      color: var(--muted);
      max-width: 60ch;
    }
    .main {
      display: flex;
      flex: 1;
      min-height: 0;
    }
    #network {
      flex: 1;
      background: var(--bg);
    }
    .sidebar {
      width: 360px;
      background: var(--panel);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
    }
    .sidebar-section {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-section h2 {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .flow-list {
      list-style: none;
      max-height: 280px;
      overflow-y: auto;
    }
    .flow-item {
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.875rem;
      margin-bottom: 4px;
      border: 1px solid transparent;
      transition: background 0.15s, border-color 0.15s;
    }
    .flow-item:hover {
      background: rgba(255,255,255,0.04);
    }
    .flow-item.active {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent);
    }
    .flow-item .flow-desc {
      display: block;
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 2px;
    }
    .steps-panel {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }
    .steps-panel h2 {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .step {
      display: flex;
      gap: 12px;
      margin-bottom: 14px;
      font-size: 0.85rem;
    }
    .step-num {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--accent);
      color: #0f1117;
      font-weight: 700;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .step-body strong {
      display: block;
      margin-bottom: 2px;
    }
    .step-body .details {
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.4;
    }
    .empty-steps {
      color: var(--muted);
      font-size: 0.85rem;
      font-style: italic;
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 14px;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .clear-btn {
      margin-top: 8px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .clear-btn:hover {
      border-color: var(--muted);
      color: var(--text);
    }
    @media (max-width: 900px) {
      .sidebar { width: 300px; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1 id="page-title">Architecture</h1>
      <p id="page-desc"></p>
    </div>
  </header>
  <div class="main">
    <div id="network"></div>
    <aside class="sidebar">
      <div class="sidebar-section">
        <h2>Flows</h2>
        <ul class="flow-list" id="flow-list"></ul>
        <button class="clear-btn" id="clear-btn">Clear selection</button>
      </div>
      <div class="sidebar-section" style="border-bottom:none; padding-bottom:8px;">
        <h2>Legend</h2>
        <div class="legend" id="legend"></div>
      </div>
      <div class="steps-panel">
        <h2>Steps</h2>
        <div id="steps-content">
          <p class="empty-steps">Select a flow to see the path through the system.</p>
        </div>
      </div>
    </aside>
  </div>

  <script>
    // ========== REPLACE THIS DATA OBJECT ==========
    const DATA = {
      meta: {
        title: "Example Architecture",
        description: "Replace this entire DATA object with the real architecture.",
        generated_at: new Date().toISOString(),
        repo_root: "."
      },
      nodes: [
        { id: "client", label: "Web Client", type: "client", group: "Client", description: "Browser SPA", files: [], tech: [] },
        { id: "api", label: "API Gateway", type: "api", group: "API", description: "Entry point", files: [], tech: [] },
        { id: "db", label: "Database", type: "database", group: "Data", description: "Primary store", files: [], tech: [] }
      ],
      edges: [
        { source: "client", target: "api", label: "calls", description: "HTTP" },
        { source: "api", target: "db", label: "reads/writes", description: "Queries" }
      ],
      flows: [
        {
          id: "example-flow",
          name: "Example request",
          description: "A sample end-to-end path",
          steps: [
            { order: 1, node: "client", action: "User action", details: "Description of what happens" },
            { order: 2, node: "api", action: "Handle request", details: "Validation and routing" },
            { order: 3, node: "db", action: "Persist", details: "Write data" }
          ]
        }
      ]
    };
    // ========== END DATA ==========

    // Color palette by group / type
    const GROUP_COLORS = {
      "Client": "#58a6ff",
      "Frontend": "#58a6ff",
      "API": "#3fb950",
      "Auth": "#f778ba",
      "Service": "#d2a8ff",
      "Core Services": "#d2a8ff",
      "Worker": "#ffa657",
      "Background": "#ffa657",
      "Data": "#79c0ff",
      "Storage": "#79c0ff",
      "Database": "#79c0ff",
      "External": "#8b949e",
      "Infra": "#8b949e",
      "Distribution": "#ffa657",
      "Build": "#ffa657"
    };
    const TYPE_FALLBACK = {
      client: "#58a6ff", frontend: "#58a6ff", api: "#3fb950",
      service: "#d2a8ff", function: "#d2a8ff", worker: "#ffa657",
      database: "#79c0ff", storage: "#79c0ff", queue: "#ffa657",
      external: "#8b949e", infra: "#8b949e", auth: "#f778ba", other: "#8b949e"
    };

    function colorFor(node) {
      return GROUP_COLORS[node.group] || TYPE_FALLBACK[node.type] || "#8b949e";
    }

    // Populate header
    document.getElementById("page-title").textContent = DATA.meta.title || "Architecture";
    document.getElementById("page-desc").textContent = DATA.meta.description || "";

    // Build vis nodes / edges
    const visNodes = new vis.DataSet(DATA.nodes.map(n => ({
      id: n.id,
      label: n.label,
      title: `<b>${n.label}</b><br>${n.type} · ${n.group}<br>${n.description || ""}${n.files && n.files.length ? "<br><br>Files: " + n.files.slice(0,4).join(", ") : ""}`,
      color: {
        background: colorFor(n),
        border: "#ffffff33",
        highlight: { background: colorFor(n), border: "#f0c14b" },
        hover: { background: colorFor(n), border: "#f0c14b" }
      },
      font: { color: "#0f1117", size: 13, face: "system-ui", bold: true },
      shape: "box",
      margin: 12,
      borderWidth: 1,
      borderWidthSelected: 3,
      group: n.group
    })));

    const visEdges = new vis.DataSet(DATA.edges.map((e, i) => ({
      id: e.id || `e${i}`,
      from: e.source,
      to: e.target,
      label: e.label || "",
      title: e.description || e.label || "",
      arrows: "to",
      color: { color: "#484f58", highlight: "#f0c14b", hover: "#8b949e" },
      font: { color: "#8b949e", size: 11, strokeWidth: 0, align: "middle" },
      smooth: { type: "cubicBezier", roundness: 0.4 }
    })));

    const container = document.getElementById("network");
    const network = new vis.Network(container, { nodes: visNodes, edges: visEdges }, {
      physics: {
        enabled: true,
        solver: "forceAtlas2Based",
        forceAtlas2Based: { gravitationalConstant: -60, centralGravity: 0.01, springLength: 120, springConstant: 0.08 },
        stabilization: { iterations: 120 }
      },
      interaction: { hover: true, tooltipDelay: 120, hideEdgesOnDrag: false },
      nodes: { shape: "box" },
      edges: { width: 1.5, selectionWidth: 3 }
    });

    // Legend
    const groups = [...new Set(DATA.nodes.map(n => n.group))];
    const legendEl = document.getElementById("legend");
    groups.forEach(g => {
      const color = GROUP_COLORS[g] || "#8b949e";
      const item = document.createElement("div");
      item.className = "legend-item";
      item.innerHTML = `<span class="legend-dot" style="background:${color}"></span>${g}`;
      legendEl.appendChild(item);
    });

    // Flow list
    const flowList = document.getElementById("flow-list");
    let activeFlowId = null;

    DATA.flows.forEach(f => {
      const li = document.createElement("li");
      li.className = "flow-item";
      li.dataset.id = f.id;
      li.innerHTML = `${f.name}<span class="flow-desc">${f.description || ""}</span>`;
      li.addEventListener("click", () => selectFlow(f.id));
      flowList.appendChild(li);
    });

    document.getElementById("clear-btn").addEventListener("click", () => selectFlow(null));

    function selectFlow(flowId) {
      activeFlowId = flowId;
      document.querySelectorAll(".flow-item").forEach(el => {
        el.classList.toggle("active", el.dataset.id === flowId);
      });

      const stepsEl = document.getElementById("steps-content");
      if (!flowId) {
        network.unselectAll();
        visNodes.forEach(n => visNodes.update({ id: n.id, opacity: 1, borderWidth: 1 }));
        visEdges.forEach(e => visEdges.update({ id: e.id, color: { color: "#484f58", highlight: "#f0c14b" }, width: 1.5 }));
        stepsEl.innerHTML = `<p class="empty-steps">Select a flow to see the path through the system.</p>`;
        return;
      }

      const flow = DATA.flows.find(f => f.id === flowId);
      if (!flow) return;

      const pathNodeIds = new Set(flow.steps.map(s => s.node));
      const pathEdgeIds = new Set();

      // Find edges that connect consecutive steps
      for (let i = 0; i < flow.steps.length - 1; i++) {
        const a = flow.steps[i].node;
        const b = flow.steps[i + 1].node;
        const edge = DATA.edges.find(e =>
          (e.source === a && e.target === b) || (e.source === b && e.target === a)
        );
        if (edge) {
          const eid = edge.id || DATA.edges.indexOf(edge);
          // We need the vis edge id
          const visEdge = visEdges.get().find(ve => ve.from === a && ve.to === b || ve.from === b && ve.to === a);
          if (visEdge) pathEdgeIds.add(visEdge.id);
        }
      }

      // Update visuals
      visNodes.forEach(n => {
        const onPath = pathNodeIds.has(n.id);
        visNodes.update({
          id: n.id,
          opacity: onPath ? 1 : 0.25,
          borderWidth: onPath ? 3 : 1,
          color: {
            background: colorFor(DATA.nodes.find(dn => dn.id === n.id)),
            border: onPath ? "#f0c14b" : "#ffffff33",
            highlight: { background: colorFor(DATA.nodes.find(dn => dn.id === n.id)), border: "#f0c14b" }
          }
        });
      });

      visEdges.forEach(e => {
        const onPath = pathEdgeIds.has(e.id);
        visEdges.update({
          id: e.id,
          width: onPath ? 3.5 : 1,
          color: {
            color: onPath ? "#f0c14b" : "#30363d",
            highlight: "#f0c14b",
            opacity: onPath ? 1 : 0.3
          }
        });
      });

      // Focus the path
      network.fit({ nodes: [...pathNodeIds], animation: true });

      // Render steps
      stepsEl.innerHTML = flow.steps
        .sort((a, b) => a.order - b.order)
        .map(s => {
          const node = DATA.nodes.find(n => n.id === s.node);
          return `
            <div class="step">
              <div class="step-num">${s.order}</div>
              <div class="step-body">
                <strong>${node ? node.label : s.node} — ${s.action}</strong>
                <div class="details">${s.details || ""}</div>
              </div>
            </div>`;
        }).join("");
    }

    // Stabilize then stop physics for better interaction
    network.once("stabilizationIterationsDone", () => {
      network.setOptions({ physics: false });
    });
  </script>
</body>
</html>
